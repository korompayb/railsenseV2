<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Térkép | RailSense</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="{{ manifest_url }}" />
    <link rel="icon" href="{{ url_for('static', filename='img/512x512.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menetrend.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');



        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #121212;
            /* sötét mód háttér */
            color: #e0e0e0;
            /* világos szöveg */
            overflow-x: hidden;
            position: relative;
        }

        #map {
            position: fixed;
            top: 1px;
            /* navbar magassága */
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://placehold.co/1920x1080?text=Map+Background+Placeholder&bg=1e293b&fg=94a3b8') center center/cover no-repeat;
            z-index: 0;
            filter: brightness(0.85);
        }

        /* Navbar fixálva fent */
        nav.navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            background-color: #1f29376e;
            /* áttetsző sötét */
            backdrop-filter: saturate(180%) blur(5px);
            box-shadow: 0 2px 8px rgb(0 0 0 / 0.7);
        }

        main {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            width: 95vw;
            max-width: 480px;
            background: #1f2937;
            border-radius: 1.5rem 1.5rem 0 0;
            box-shadow: 0 -8px 24px rgb(0 0 0 / 0.8);
            padding: 0 1.25rem .75rem;
            color: #d1d5db;
            max-height: 220px;
            overflow: hidden;
            transition: max-height .38s cubic-bezier(.4, 0, .2, 1);
        }

        main.expanded {
            max-height: 82vh;
            overflow: hidden;
        }

        #sheet-handle {
            text-align: center;
            padding: .65rem 0 .35rem;
            cursor: pointer;
        }

        .handle-pill {
            width: 3rem;
            height: .3rem;
            background: #4b5563;
            border-radius: 9999px;
            margin: 0 auto;
            transition: background .2s;
        }

        #sheet-handle:hover .handle-pill {
            background: #6b7280;
        }

        .hero-badge {
            font-weight: 900;
            font-size: 1.35rem;
            padding: .45rem 1rem;
            border-radius: .6rem;
            min-width: 58px;
            text-align: center;
            flex-shrink: 0;
            line-height: 1.2;
        }

        #sheet-body {
            display: none;
            padding-top: .25rem;
        }

        main.expanded #sheet-body {
            display: block;
        }

        #trains-list .card {
            max-width: 100% !important;
            margin-bottom: .6rem;
        }

        .status-badge {
            border-radius: .5rem;
            padding: .3rem .75rem;
            font-size: .82rem;
            font-weight: 700;
            text-align: center;
            margin-top: .45rem;
        }

        .status-safe {
            background: #064e3b;
            color: #6ee7b7;
        }

        .status-danger {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .status-warn {
            background: #78350f;
            color: #fcd34d;
        }

        .train-alert {
            position: fixed;
            width: fit-content;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0000003a;
            color: white;
            border-radius: 10px;
            padding: 3px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            opacity: 1;
            transition: opacity 0.5s ease-out, top 0.5s ease-out;
            width: max-content;
        }

        .leaflet-circle {
            stroke: #FF5733;
            /* Kör színe */
            stroke-width: 2px;
            /* Kör vonalának vastagsága */
            fill: rgba(255, 87, 51, 0.3);
            /* Kör belsejének színe és átlátszósága */
        }

        .train-alert.show {
            top: 70px;
            opacity: 1;
        }

        .train-alert p {
            text-align: center;
        }


        div .leaflet-control-attribution {
            display: none !important;
        }

        .custom-marker {
            background-color: transparent;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .marker-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
        }


        .custom-marker {
            margin-left: -14px !important;
            margin-top: -10px !important;
            width: 12px;
            height: 12px;
            transform: translate3d(627px, 419px, 0px);
            z-index: 419;
            outline-style: none;
        }


        :host(.mk-controls-container) div.mk-logo-control img.mk-logo {
            width: var(--logo-width);
            height: var(--logo-height);
            margin: 0;
            transition: width .3s ease-in-out, height .3s ease-in-out;
        }


        .notification-inner {
            backdrop-filter: blur(0.5rem);
            backdrop-filter: blur(0.5rem);
            padding: 0 1rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;

            h2 {
                font-weight: bold;
                font-size: 0.9rem;
            }

            p {
                margin-top: 0.5rem;
                font-size: 0.8rem;
            }

            .close {
                background: none;
                border: none;
                position: absolute;
                right: 0;
                top: 0;
                font-size: 0.8rem;
                padding-right: 0.5rem;
                cursor: pointer;
                display: flex;
            }

            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 3.5rem;
                height: 3.5rem;
                border-radius: 0.5rem;
                margin-right: 1rem;
                font-size: 1rem;
                color: white;

                &.error {
                    background-color: #f87171;
                }

                &.success {
                    background-color: #10b981;
                }

                &.info {
                    background-color: #60a5fa;
                }

                &.warning {
                    background-color: #f59e0b;
                }
            }
        }


        @media (max-width: 400px) {
            main {
                padding: 0 .75rem .5rem;
                width: 100vw;
                border-radius: 1rem 1rem 0 0;
            }
        }

        /* Cards inside the sheet match the sheet's dark palette */
        #trains-list .card {
            background: #243347 !important;
            border: 1px solid #374151 !important;
            border-radius: .75rem !important;
        }

        #trains-list .card-header {
            background: transparent !important;
            border-bottom: 1px solid #374151 !important;
        }

        #trains-list .card-body {
            background: transparent !important;
        }

        #trains-list .card-footer {
            background: transparent !important;
            border-top: 1px solid #374151 !important;
        }

        #trains-list .accordion-item {
            background: transparent !important;
            border: none !important;
        }

        #trains-list .accordion-button {
            background: #1e2d40 !important;
            color: #d1d5db !important;
            border-radius: .5rem !important;
        }

        #trains-list .accordion-button:not(.collapsed) {
            background: #1a2a3a !important;
        }

        #trains-list .accordion-body {
            background: #1a2a3a !important;
            color: #d1d5db !important;
        }

        .leaflet-top {
            top: 50px !important;
        }
    </style>
</head>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const latitude = {{ lat }};
        const longitude = {{ lon }};

        var map = L.map('map').setView([latitude, longitude], 13);
        var jawgLayer = L.tileLayer('https://tile.jawg.io/jawg-sunny/{z}/{x}/{y}{r}.png?access-token={accessToken}', {
            attribution: '<a href="https://jawg.io" title="Tiles Courtesy of Jawg Maps" target="_blank">&copy; <b>Jawg</b>Maps</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            minZoom: 0,
            maxZoom: 22,
            accessToken: 'iGR4cAeILxmIyHrzUkdz1fKcfoWHenxaQdGtzAO6ZDkC6vGJ8SwVuT8Kyh7Mf8af'
        });

        jawgLayer.addTo(map);

        var stopsLayerGroup = L.layerGroup().addTo(map); // LayerGroup létrehozása a járművek tárolására
        var userMarker = L.marker([latitude, longitude], { icon: L.icon({ iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Google_Maps_pin.svg/20px-Google_Maps_pin.svg.png', iconSize: [25, 41] }) }).addTo(map);

        // Függvény a térkép középpontjának frissítésére és járművek újra lekérésére
        function updateVehicles() {
            var center = map.getCenter(); // Aktuális térkép középpontja
            var lat = center.lat.toFixed(7); // Latitúdó 7 tizedesjegyig kerekítve
            var lon = center.lng.toFixed(7); // Hosszúság 7 tizedesjegyig kerekítve
            var radius = 10000; // Sugár: 10000 méter

            const selectedVehicleTypes = ["RAIL"]; // Alapértelmezett filter

            var apiUrl = `https://futar.bkk.hu/api/query/v1/ws/otp/api/where/vehicles-for-location?clientLon=${lon}&clientLat=${lat}&onlyDepartures=false&limit=60&lat=${lat}&lon=${lon}&radius=${radius}&minResult=1&appVersion=1.1.abc&version=2&includeReferences=true&minutesAfter=60&key=7ff7c954-05d3-4dd2-93b6-cb714dcdca69`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    stopsLayerGroup.clearLayers();
                    if (data.data && data.data.list && data.data.references) {
                        var vehicles = data.data.list;
                        var stops = data.data.references.stops;
                        var routes = data.data.references.routes;
                        console.log(apiUrl);
                        var trainNearby = false;

                        vehicles.forEach(function (vehicle) {
                            if (selectedVehicleTypes.includes(vehicle.vehicleRouteType)) {
                                var direction = vehicle.bearing || 0;

                                // A vonat megjelenítése a térképen
                                var marker = L.marker([vehicle.location.lat, vehicle.location.lon], {
                                    icon: L.divIcon({
                                        className: 'custom-marker',
                                        html: `<svg width="25" height="35" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(${direction}deg);">
                                    <path d="M23.9395 18.7344C23.9395 24.8689 18.8493 29.959 12.7148 29.959C6.5909 29.959 1.5 24.8696 1.5 18.7344C1.5 12.6082 6.58187 7.51953 12.7051 7.51953C18.8418 7.51953 23.9395 12.6119 23.9395 18.7344Z" fill="white" stroke="#${routes[vehicle.routeId].color}" stroke-width="3"/>
                                    <path d="M21 6L15 4.875L13 4.5L11 4.875L5 6L13 0L21 6Z" fill="black"/>
                                    </svg>`
                                    })
                                }).addTo(stopsLayerGroup)
                                    .bindPopup(`<h6>
                                    <div class="viszonylatdoboz d-flex justify-content-center align-items-center"
                                    style="padding: 5px; border-radius: 5px; background-color:#${routes[vehicle.routeId].color}!important; width: 50px; height: 30px;">
                                    <span style="font-weight: bold; color: #${routes[vehicle.routeId].textColor};">${routes[vehicle.routeId].shortName}</span>
                                    </div>${routes[vehicle.routeId].description}</h6>
                                    <strong>${vehicle.status === 'IN_TRANSIT_TO' ? stops[vehicle.stopId].name + ' felé közeledik' : vehicle.status === 'STOPPED_AT' ? stops[vehicle.stopId].name + ' megállóhelyen áll' : vehicle.status}</strong><br>
                                    <em>${vehicle.label}</em><br>`)
                                    .on('click', function () {
                                        fetchTripDetails(vehicle.tripId, this);
                                    });

                                // Ellenőrizzük, hogy a vonat 2 km-es körön belül van-e
                                if (isTrainWithinRadius(vehicle.location.lat, vehicle.location.lon, latitude, longitude, 2)) {
                                    trainNearby = true;
                                }
                            }
                        });

                        var alertElement = document.getElementById('trainAlert');
                        if (trainNearby) {
                            alertElement.classList.add('show');
                        } else {
                            alertElement.classList.remove('show');
                        }

                    } else {
                        throw new Error('Vehicles data not found in API response');
                    }
                })
                .catch(error => console.error('Error fetching vehicles:', error));
        }

        // (duplicate geolocation functions removed — single canonical set below)


        // Függvény a távolság számításához (Haversine formula alapján)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // A Föld sugara km-ben
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c;
            return distance;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        // Függvény annak ellenőrzésére, hogy a vonat 2 km-en belül van-e
        function isTrainWithinRadius(trainLat, trainLon, userLat, userLon, radiusInKm) {
            const distance = getDistanceFromLatLonInKm(trainLat, trainLon, userLat, userLon);
            return distance <= radiusInKm;
        }

        // Geolocation API to get the user's current position
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, handleError, {
                    enableHighAccuracy: true
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function showPosition(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            map.setView([lat, lon], 13);
            userMarker.setLatLng([lat, lon]);
            fetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lon: lon }),
            })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        userMarker.bindPopup(data.address).openPopup();
                        fetchTrainData();
                    }
                })
                .catch(err => console.error('Location update error:', err));
        }

        function handleError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    alert("Nem kaptam engedélyt a GPS adataidhoz :(");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Location information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user location timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }

        map.on('moveend', function () {
            updateVehicles();
        });

        updateVehicles();
        setInterval(updateVehicles, 10000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

    <!-- ── Train sheet JS ────────────────────────────────────── -->
    <script>
        // Sheet expand/collapse
        let sheetExpanded = false;
        function toggleSheet() {
            sheetExpanded = !sheetExpanded;
            document.getElementById('train-sheet').classList.toggle('expanded', sheetExpanded);
        }

        // HTML escape
        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Lazy-load stop list
        function renderStops(stops, lineColor, stopSeq) {
            if (!stops || !stops.length) return '';
            let html = `<ul class="line line--m2" style="--line-color:#${esc(lineColor || '808080')} !important;border-color:var(--line-color);">`;
            stops.forEach((stop, i) => {
                const cls = i === 0 ? 'station--start' : (i === stops.length - 1 ? 'station--end2' : 'station--default');
                const tag = cls !== 'station--default' ? 'strong' : 'span';
                const hi = String(stop.stopseqe2) === String(stopSeq) ? ' highlight' : '';
                html += `<li class="station ${cls}"><${tag} class="stop-name${hi}">${esc(stop.stop_name)}</${tag}><span style="float:inline-end;" class="arrival-time">${esc(stop.arrival_time)}</span></li>`;
            });
            return html + '</ul>';
        }
        function loadTripDetails(collapseEl) {
            const tripId = collapseEl.dataset.tripId;
            if (!tripId || collapseEl.dataset.loaded === 'true') return;
            collapseEl.dataset.loaded = 'true';
            const table = collapseEl.querySelector('.trip-details-wrap');
            if (!table) return;
            table.innerHTML = '<div class="text-center text-muted py-2"><span class="spinner-border spinner-border-sm me-2"></span>Betöltés...</div>';
            fetch('/api/trip-details/' + encodeURIComponent(tripId))
                .then(r => r.json())
                .then(data => {
                    if (!data.ok || !data.stops || !data.stops.length) {
                        table.innerHTML = '<div class="text-muted text-center py-2 small">Menetrend nem elérhető.</div>';
                        return;
                    }
                    table.innerHTML = renderStops(data.stops, collapseEl.dataset.lineColor, collapseEl.dataset.stopSequence);
                })
                .catch(() => {
                    collapseEl.dataset.loaded = 'false';
                    table.innerHTML = '<div class="text-muted text-center py-2 small">Hálózati hiba.</div>';
                });
        }
        function attachTripLoaders(root) {
            (root || document).querySelectorAll('.accordion-collapse[data-trip-id]').forEach(el => {
                el.addEventListener('show.bs.collapse', function () { loadTripDetails(this); });
            });
        }

        const TRAIN_SVG_SM = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" viewBox="0 0 26 23" fill="none"><g clip-path="url(#clt)"><path d="M3.79883 22.9785H21.2109C23.7402 22.9785 25.0195 21.709 25.0195 19.2188V3.78906C25.0195 1.29883 23.7402 0.0292969 21.2109 0.0292969H3.79883C1.2793 0.0292969 0 1.28906 0 3.78906V19.2188C0 21.7188 1.2793 22.9785 3.79883 22.9785ZM3.66211 21.25C2.41211 21.25 1.72852 20.5859 1.72852 19.2969V7.64648C1.72852 6.34766 2.41211 5.69336 3.66211 5.69336H21.3379C22.5781 5.69336 23.2812 6.34766 23.2812 7.64648V19.2969C23.2812 20.5859 22.5781 21.25 21.3379 21.25H3.66211Z" fill="#C6C6C6"/></g><defs><clipPath id="clt"><rect width="25.3809" height="22.9785" fill="white"/></clipPath></defs></svg>`;
        const CLOCK_SVG_SM = `<svg width="18" height="18" viewBox="0 0 22 19" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M9.0791 18.7334C10.292 18.7334 11.4697 18.4873 12.5508 18.0303C12.1377 17.582 11.8213 17.0547 11.5928 16.4922C10.8105 16.7822 9.9668 16.9492 9.0791 16.9492C5.03613 16.9492 1.79297 13.6973 1.79297 9.6543C1.79297 5.61133 5.02734 2.36816 9.07031 2.36816C12.7266 2.36816 15.7412 5.04004 16.2686 8.54688C16.8135 8.45898 17.5342 8.48535 18.0879 8.62598C17.5693 4.12598 13.6934 0.575195 9.07031 0.575195C4.0957 0.575195 0 4.68848 0 9.6543C0 14.6289 4.10449 18.7334 9.0791 18.7334ZM4.63184 10.7441H9.07031C9.46582 10.7441 9.76465 10.4365 9.76465 10.0498V4.28418C9.76465 3.89746 9.46582 3.58984 9.07031 3.58984C8.68359 3.58984 8.37598 3.89746 8.37598 4.28418V9.35547H4.63184C4.23633 9.35547 3.9375 9.6543 3.9375 10.0498C3.9375 10.4365 4.23633 10.7441 4.63184 10.7441ZM16.875 18.7773C19.3359 18.7773 21.4014 16.7207 21.4014 14.251C21.4014 11.7725 19.3535 9.7334 16.875 9.7334C14.3965 9.7334 12.3486 11.7725 12.3486 14.251C12.3486 16.7383 14.3965 18.7773 16.875 18.7773ZM16.3477 16.9229C16.1807 16.9229 15.9785 16.8525 15.8467 16.7119L14.1943 14.9014C14.1064 14.8135 14.0449 14.6377 14.0449 14.4883C14.0449 14.1104 14.335 13.8643 14.6689 13.8643C14.8711 13.8643 15.0293 13.9434 15.1436 14.0664L16.3125 15.3496L18.5537 12.2295C18.6768 12.0713 18.8613 11.957 19.0811 11.957C19.4238 11.957 19.7139 12.2295 19.7139 12.5811C19.7139 12.6865 19.6699 12.8271 19.582 12.9414L16.8662 16.6855C16.7607 16.8262 16.5586 16.9229 16.3477 16.9229Z"/></svg>`;

        function renderTrainCard(train, idx) {
            return `<div class="card" data-trip="${esc(train.route_id)}-${esc(train.headsign)}">
  <div style="padding:0;overflow:hidden;" class="card-header">
    <div style="float:left;padding:10px 12px;">
      <p class="card-title text-light mb-1" style="font-size:.82rem;">${esc(train.description)}</p>
      <h5 class="card-subtitle mb-0" style="color:#FC2F44;margin-top:3px;">${esc(train.headsign)}</h5>
    </div>
    <div class="viszonylatdoboz d-flex justify-content-center align-items-center" style="float:right;padding:8px;border-top-right-radius:5px;background-color:#${esc(train.color || '808080')} !important;width:78px;height:72px;">
      <span class="shortname" style="font-weight:bold;font-size:1.1rem;color:#${esc(train.text_color || 'ffffff')};">${esc(train.short_name)}</span>
    </div>
  </div>
  <div class="card-body text-light py-2">
    <div class="accordion" id="acc-${idx}">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#col-${idx}" style="min-height:42px;font-size:.9rem;">
            ${TRAIN_SVG_SM}<span style="padding-left:8px;">Menetrend</span>
          </button>
        </h2>
        <div id="col-${idx}" class="accordion-collapse collapse"
            data-trip-id="${esc(train.trip_id || '')}"
            data-line-color="${esc(train.color || '808080')}"
            data-stop-sequence="${esc(String(train.stop_sequence || ''))}"
            data-loaded="false">
          <div class="accordion-body py-2">
            <div class="trip-details-wrap" id="mnt-${idx}"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer py-2" style="background-color:transparent;border-top:1px solid #374151;">
    <div style="display:flex;align-items:center;gap:.4rem;">
      ${CLOCK_SVG_SM}
      <span style="font-size:.9rem;"><b>${esc(train.predicted_arrival_minutes)}</b></span>
    </div>
  </div>
</div>`;
        }

        function renderHero(data) {
            const train = data.trains && data.trains[0];
            const badge = document.getElementById('hero-badge');
            const desc = document.getElementById('hero-description');
            const hsign = document.getElementById('hero-headsign');
            const mins = document.getElementById('hero-mins');
            const bar = document.getElementById('status-bar');
            if (train) {
                badge.textContent = train.short_name || '?';
                badge.style.background = '#' + (train.color || '808080');
                badge.style.color = '#' + (train.text_color || 'ffffff');
                desc.textContent = train.description || '';
                hsign.textContent = train.headsign || '';
                mins.textContent = train.predicted_arrival_minutes || '';
                bar.className = 'status-badge status-danger';
                bar.textContent = 'Az átkelés veszélyes!';
            } else {
                badge.textContent = '✓';
                badge.style.background = '#3FC555';
                badge.style.color = '#fff';
                desc.textContent = 'Nincs vonat a közelben';
                hsign.textContent = 'Szabad az átkelés';
                mins.textContent = '';
                bar.className = 'status-badge status-safe';
                bar.textContent = 'Az átkelés biztonságos';
            }
        }

        function renderTrainList(data) {
            const container = document.getElementById('trains-list');
            if (!container) return;
            container.innerHTML = (data.trains || []).map((t, i) => renderTrainCard(t, i + 1)).join('');
            attachTripLoaders(container);
            const ut = document.getElementById('update-time');
            if (ut) ut.textContent = 'Most frissítve';
        }

        async function fetchTrainData() {
            try {
                const resp = await fetch('/api/trains');
                const data = await resp.json();
                renderHero(data);
                renderTrainList(data);
            } catch (e) { console.error('fetchTrainData:', e); }
        }

        fetchTrainData();
        setInterval(fetchTrainData, 30000);
    </script>

    <!-- ── Location bottom sheet ────────────────────────────── -->
    <div id="loc-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;"
        onclick="closeLocationSheet()"></div>
    <div id="loc-sheet"
        style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1f2937;border-radius:1.5rem 1.5rem 0 0;padding:1.5rem;z-index:3001;transform:translateY(100%);transition:transform .3s ease;max-height:85vh;overflow-y:auto;">
        <div style="text-align:center;margin-bottom:1rem;">
            <div style="width:3rem;height:.3rem;background:#4b5563;border-radius:9999px;margin:0 auto .75rem;"></div>
            <h5 class="text-light mb-0">Helyszín beállítása</h5>
        </div>
        <button class="btn btn-success w-100 mb-3" id="gps-btn" onclick="useGPS()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-geo-alt me-2" viewBox="0 0 16 16">
                <path
                    d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6" />
            </svg>
            GPS helymeghatározás
        </button>
        <div class="input-group mb-2">
            <input type="text" id="loc-search-input" class="form-control" placeholder="Keresés helyre...">
            <button class="btn btn-outline-light" onclick="searchLocationSheet()">Keresés</button>
        </div>
        <div id="loc-search-results" class="mb-3"></div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary btn-sm"
                onclick="setPreset(47.047663,18.057475,'Füzfő')">Füzfő</button>
            <button class="btn btn-outline-secondary btn-sm"
                onclick="setPreset(46.8147826,17.5714996,'Ábrahámhegy')">Ábrahámhegy</button>
            <button class="btn btn-outline-secondary btn-sm"
                onclick="setPreset(46.72243,17.5186394,'Alsóbélatelep')">Alsóbélatelep</button>
        </div>
        <p class="text-muted small mt-3 mb-0">Vagy kattints a térképre a helyszín megadásához.</p>
    </div>
    <script>
        function openLocationSheet() {
            const sheet = document.getElementById('loc-sheet');
            sheet.style.display = 'block';
            document.getElementById('loc-overlay').style.display = 'block';
            requestAnimationFrame(() => { sheet.style.transform = 'translateY(0)'; });
        }
        function closeLocationSheet() {
            const sheet = document.getElementById('loc-sheet');
            sheet.style.transform = 'translateY(100%)';
            document.getElementById('loc-overlay').style.display = 'none';
            setTimeout(() => { sheet.style.display = 'none'; }, 300);
        }
        function useGPS() {
            const btn = document.getElementById('gps-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Helymeghatározás...';
            if (!navigator.geolocation) { btn.disabled = false; return; }
            navigator.geolocation.getCurrentPosition(
                pos => { closeLocationSheet(); showPosition(pos); },
                () => { btn.disabled = false; btn.innerHTML = 'GPS helymeghatározás'; alert('Nem sikerült a helymeghatározás.'); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
        function searchLocationSheet() {
            const q = document.getElementById('loc-search-input').value.trim();
            if (!q) return;
            fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&q=' + encodeURIComponent(q))
                .then(r => r.json())
                .then(results => {
                    const div = document.getElementById('loc-search-results');
                    div.innerHTML = '';
                    if (!results.length) { div.innerHTML = '<p class="text-muted small">Nincs találat.</p>'; return; }
                    results.forEach(place => {
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-outline-secondary w-100 mb-1 text-start text-truncate';
                        btn.textContent = place.display_name;
                        btn.onclick = () => updateMapLocation(parseFloat(place.lat), parseFloat(place.lon), place.display_name);
                        div.appendChild(btn);
                    });
                }).catch(() => { });
        }
        function setPreset(lat, lon, name) { updateMapLocation(lat, lon, name); }
        function updateMapLocation(lat, lon, address) {
            fetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lon }),
            })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        map.setView([lat, lon], 13);
                        userMarker.setLatLng([lat, lon]);
                        userMarker.bindPopup(data.address || address || '').openPopup();
                        closeLocationSheet();
                        fetchTrainData();
                        updateVehicles();
                    }
                })
                .catch(() => { });
        }
        // Wire map click to show location sheet hint
        map.on('click', function (e) {
            updateMapLocation(e.latlng.lat, e.latlng.lng);
        });
    </script>
